# オンプレミス公開用の nginx 設定。
# HTTP(80) は HTTPS へリダイレクトするのみで、実際の配信/プロキシは443番で行う。

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name _;

  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  index index.html;

  # SPA ルーティング
  location / {
    try_files $uri $uri/ /index.html;
  }

  # /api はバックエンドコンテナへプロキシ。
  # variable 経由の proxy_pass にすることで、backend への名前解決を
  # 起動時ではなくリクエスト時に行う（Docker の embedded DNS = 127.0.0.11）。
  # 直書きの proxy_pass は起動時に一度だけ解決するため、backend の起動が
  # 一瞬でも遅れると nginx がそのまま起動失敗しクラッシュループする。
  resolver 127.0.0.11 valid=30s;
  location /api/ {
    set $backend_upstream http://backend:3000;
    # variable を使う proxy_pass はプレフィックスの自動付け替えをしないため、
    # $request_uri でパス(/api/...)とクエリを元のまま引き継ぐ。
    proxy_pass $backend_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
